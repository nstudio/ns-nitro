// You can add your native dependencies here
dependencies {
  // Jetpack WindowManager: folding feature (hinge position and posture) for foldables.
  implementation 'androidx.window:window:1.3.0'
  implementation 'androidx.window:window-java:1.3.0'
  implementation 'com.google.android.material:material:1.8.0'
}

android {
  compileSdkVersion 36
  buildToolsVersion "36"
  // ndkVersion ""

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36

    // Version Information
    versionCode 1
    versionName "1.0.0"
    
    generatedDensities = []

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20 -fexceptions -frtti"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
