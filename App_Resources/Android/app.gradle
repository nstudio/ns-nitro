// You can add your native dependencies here
dependencies {
  // Jetpack WindowManager: folding feature (hinge position and posture) for foldables.
  implementation 'androidx.window:window:1.3.0'
  implementation 'androidx.window:window-java:1.3.0'
  implementation 'com.google.android.material:material:1.8.0'

  // Nitro Modules v1 (nitro-core) Kotlin/JNI runtime
  implementation 'com.facebook.fbjni:fbjni:0.8.1'
  implementation 'com.facebook.yoga:proguard-annotations:1.19.0'
  implementation 'com.facebook.soloader:nativeloader:0.12.1'
  implementation 'androidx.annotation:annotation:1.8.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
  compileOnly 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
}

android {
  compileSdkVersion 36
  buildToolsVersion "36"
  // fbjni 0.8.1 needs libc++_shared from NDK r28 or newer (__cxa_init_primary_exception).
  ndkVersion "29.0.14206865"

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36

    // Version Information
    versionCode 1
    versionName "1.0.0"
    
    generatedDensities = []

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20 -fexceptions -frtti"
        // fbjni's prefab package requires the shared C++ runtime.
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  buildFeatures {
    prefab true
  }

  sourceSets {
    main {
      java.srcDirs += [
        "${rootDir}/../../node_modules/nitro-core/native/android/src/main/java",
        "${rootDir}/../../nitrogen/generated/android/kotlin",
        "${rootDir}/../../nitro/android/kotlin",
        "${rootDir}/../../nitro/android/java",
      ]
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
